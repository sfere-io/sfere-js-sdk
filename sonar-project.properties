# SonarQube Cloud analysis, run by the `sonar` job in .github/workflows/ci.yml.
# The keys must match the project created at https://sonarcloud.io/projects/create
# (default key for an imported GitHub repo is <org>_<repo>).
sonar.organization=fanfinity
sonar.projectKey=fanfinity_sfere-sdk
sonar.projectName=sfere-sdk

sonar.sources=packages/browser/src,packages/node/src,packages/shared/src
sonar.tests=packages/browser/test,packages/node/test

# Build output, coverage reports, the CDN loader snippet (published as an HTML
# fragment for docs, not app code) and the CDN bundle itself are not ours to grade.
sonar.exclusions=\
  **/dist/**,\
  **/coverage/**,\
  **/node_modules/**,\
  packages/browser/src/cdn/snippet.html,\
  **/test/e2e/.tmp/**,\
  **/*.min.js

sonar.javascript.lcov.reportPaths=packages/browser/coverage/lcov.info,packages/node/coverage/lcov.info
sonar.typescript.tsconfigPaths=packages/browser/tsconfig.json,packages/node/tsconfig.json

sonar.sourceEncoding=UTF-8

# Fail the job when the quality gate fails.
sonar.qualitygate.wait=true
