version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # Minor and patch bumps travel together; each major gets its own PR so one
    # breaking upgrade can't block the rest (PR #1 bundled TypeScript 7 and failed).
    groups:
      npm-dependencies:
        patterns:
          - "*"
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is the native rewrite; typescript-eslint 8.x declares
      # typescript <7 as its peer range, so `npm ci` fails with ERESOLVE. Lift this
      # once typescript-eslint ships TS 7 support.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 10
