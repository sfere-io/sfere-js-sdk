name: cdn-deploy

# Deploys a tagged build's dist/cdn/ bundles to the CDN bucket (see
# infra/cdn/README.md and docs/CDN-POLICY.md). Called by release.yml right after
# a version publishes, or run by hand (workflow_dispatch) for a rollback / a
# re-deploy of an already-published version.
#
# Two targets share this workflow (input `target`, default `sdk`):
#   sdk    the browser SDK, tag vX.Y.Z, packages/browser -> /sdk/v{X.Y.Z}/ + alias
#   salla  the Salla storefront integration, tag @fanfinity/sfere-salla@X.Y.Z,
#          packages/salla -> /integrations/salla/v{X.Y.Z}/ + alias
# Path prefix and file list come from the package's own package.json (`sfereCdn`,
# read by scripts/cdn-publish.sh and cdn-manifest.mjs); the browser SDK has none
# and keeps the defaults, so its paths are unchanged.
#
# Deliberately green before the CDN infra exists: `check-config` reads the
# repository Variables it needs and skips the deploy job cleanly (with a step
# summary note, not a failure) when any of them isn't set yet. That keeps
# release.yml passing end to end while infra/cdn/provision.sh is still unrun.
on:
  workflow_call:
    inputs:
      version:
        description: "Bare semver to deploy, no leading 'v' (e.g. 0.1.0 or 0.2.0-next.0)"
        required: true
        type: string
      target:
        description: "What to deploy: sdk (browser SDK) or salla (Salla storefront integration)"
        required: false
        type: string
        default: sdk
  workflow_dispatch:
    inputs:
      version:
        description: "Bare semver to deploy, no leading 'v' (e.g. 0.1.0 or 0.2.0-next.0)"
        required: true
        type: string
      target:
        description: "What to deploy: sdk (browser SDK) or salla (Salla storefront integration)"
        required: false
        type: choice
        options: [sdk, salla]
        default: sdk
      alias_only:
        description: "Rollback: only re-point the alias at this already-published version (skips the immutable upload, which would otherwise be refused by --if-generation-match=0)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cdn-deploy
  cancel-in-progress: false

jobs:
  check-config:
    runs-on: ubuntu-24.04
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Resolve the target's tag
        id: target
        env:
          TARGET: ${{ inputs.target || 'sdk' }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$TARGET" in
            sdk) echo "ref=v${VERSION}" >> "$GITHUB_OUTPUT" ;;
            salla) echo "ref=@fanfinity/sfere-salla@${VERSION}" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown target '$TARGET' (sdk or salla)"; exit 1 ;;
          esac
      - name: Check required repository variables
        id: check
        run: |
          missing=()
          [ -n "${{ vars.WIF_PROVIDER }}" ] || missing+=("WIF_PROVIDER")
          [ -n "${{ vars.CDN_DEPLOY_SA }}" ] || missing+=("CDN_DEPLOY_SA")
          [ -n "${{ vars.GCP_PROJECT_ID }}" ] || missing+=("GCP_PROJECT_ID")
          [ -n "${{ vars.CDN_BUCKET }}" ] || missing+=("CDN_BUCKET")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### CDN deploy skipped"
              echo "Missing repository variable(s): ${missing[*]}."
              echo "See infra/cdn/README.md to provision the CDN and set them."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: check-config
    if: needs.check-config.outputs.configured == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: cdn-production
      url: ${{ vars.CDN_BASE_URL }}
    permissions:
      contents: read
      id-token: write # Workload Identity Federation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.check-config.outputs.ref }}

      # Where the package lives in the checked-out tag. The browser SDK: packages/browser since
      # the workspace layout (after v0.3.0), the repo root before it, so rollbacks to an older
      # tag keep working with this newer workflow. The Salla integration: packages/salla, which
      # publishes with the browser package's script. CDN_PREFIX / CDN_ENTRY / CDN_BANNER come
      # from the package's `sfereCdn` (the SDK has none: sdk / sfere.min.js / "Sfere SDK").
      - name: Locate the package
        env:
          TARGET: ${{ inputs.target || 'sdk' }}
        run: |
          if [ "$TARGET" = "salla" ]; then
            DIR=packages/salla
            PUBLISH=../browser/scripts/cdn-publish.sh
          elif [ -f packages/browser/package.json ]; then
            DIR=packages/browser
            PUBLISH=scripts/cdn-publish.sh
          else
            DIR=.
            PUBLISH=scripts/cdn-publish.sh
          fi
          cdn() { PKG="$DIR/package.json" KEY="$1" DEF="$2" node -p \
            'const c = require(require("path").resolve(process.env.PKG)).sfereCdn || {}; c[process.env.KEY] || process.env.DEF'; }
          {
            echo "PKG_DIR=$DIR"
            echo "PUBLISH_SCRIPT=$PUBLISH"
            echo "CDN_PREFIX=$(cdn prefix sdk)"
            echo "CDN_ENTRY=$(cdn entry sfere.min.js)"
            echo "CDN_BANNER=$(cdn banner 'Sfere SDK')"
          } >> "$GITHUB_ENV"
          echo "Package directory in ${{ needs.check-config.outputs.ref }}: $DIR" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Rebuilt here rather than fetched from the release, so the bytes deployed
      # to the CDN are provably reproducible from the tagged source rather than a
      # human-uploaded artifact.
      - run: npm run build
      - run: npm run verify
      - run: npm run cdn:manifest

      - name: Tag must match package.json version
        run: |
          PKG="$(node -p "require('./$PKG_DIR/package.json').version")"
          if [ "$PKG" != "${{ inputs.version }}" ]; then
            echo "::error::checked-out package.json version ($PKG) does not match the requested version (${{ inputs.version }})"
            exit 1
          fi

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CDN_DEPLOY_SA }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      # `inputs.alias_only` only exists on workflow_dispatch; on workflow_call it is
      # empty, which the comparison treats as false (a normal, full publish).
      - name: Publish to the CDN bucket
        working-directory: ${{ env.PKG_DIR }}
        run: |
          if [ "${{ inputs.alias_only }}" = "true" ]; then
            "$PUBLISH_SCRIPT" "${{ inputs.version }}" --alias-only
          else
            "$PUBLISH_SCRIPT" "${{ inputs.version }}"
          fi
        env:
          CDN_BUCKET: ${{ vars.CDN_BUCKET }}

      # Purge the alias from the edge so it serves the new version at once (serve-while-stale kept
      # the old alias ~8 minutes on the 0.3.2 deploy). The deploy SA may invalidate only this URL
      # map (infra/cdn/provision.sh). A failure here only costs time: the alias smoke below still
      # waits for the edge, so it warns instead of failing the deploy.
      - name: Invalidate the alias on the CDN
        if: vars.CDN_BASE_URL != '' && !contains(inputs.version, '-')
        env:
          CDN_URL_MAP: ${{ vars.CDN_URL_MAP || 'sfere-sdk-cdn-lb' }}
          CDN_PROJECT: ${{ vars.GCP_PROJECT_ID }}
          VERSION: ${{ inputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" = "0" ]; then SEGMENT="v0.${MINOR}"; else SEGMENT="v${MAJOR}"; fi
          if gcloud compute url-maps invalidate-cdn-cache "$CDN_URL_MAP" --global --async \
               --project="$CDN_PROJECT" --path="/${CDN_PREFIX}/${SEGMENT}/*"; then
            echo "Invalidated /${CDN_PREFIX}/${SEGMENT}/* on $CDN_URL_MAP." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::CDN invalidation of /${CDN_PREFIX}/${SEGMENT}/* failed; the alias smoke will wait for the edge instead."
          fi

      - name: Smoke-test the public URL
        if: vars.CDN_BASE_URL != ''
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
        run: |
          set -euo pipefail
          URL="${CDN_BASE_URL%/}/${CDN_PREFIX}/v${{ inputs.version }}/${CDN_ENTRY}"
          EXPECTED="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.PKG_DIR + "/dist/cdn/manifest.json","utf8")).files.find(f=>f.path==="dist/cdn/"+process.env.CDN_ENTRY).sha384')"

          echo "Fetching $URL"
          curl -fsS -D headers.txt -o downloaded.js "$URL"

          ACTUAL="sha384-$(openssl dgst -sha384 -binary downloaded.js | openssl base64 -A)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::SRI mismatch for $URL: manifest says $EXPECTED, downloaded file hashes to $ACTUAL"
            exit 1
          fi
          echo "SRI hash matches manifest.json: $EXPECTED"

          CACHE_CONTROL="$(grep -i '^cache-control:' headers.txt | tr -d '\r' | cut -d' ' -f2-)"
          CONTENT_TYPE="$(grep -i '^content-type:' headers.txt | tr -d '\r' | cut -d' ' -f2-)"
          echo "Cache-Control: $CACHE_CONTROL"
          echo "Content-Type: $CONTENT_TYPE"

          case "$CACHE_CONTROL" in
            *immutable*) : ;;
            *) echo "::error::expected an immutable Cache-Control on $URL, got: $CACHE_CONTROL"; exit 1 ;;
          esac
          case "$CONTENT_TYPE" in
            application/javascript*) : ;;
            *) echo "::error::expected a javascript Content-Type on $URL, got: $CONTENT_TYPE"; exit 1 ;;
          esac

          {
            echo "### CDN smoke test passed"
            echo "- URL: $URL"
            echo "- SRI: \`$EXPECTED\`"
            echo "- Cache-Control: \`$CACHE_CONTROL\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # The hash check above proves the bytes; this proves they work where clients run them. A real
      # Chromium loads the live bundle (test/e2e/specs/cdn-smoke.spec.ts) and must deliver events to
      # the mock ingestion host: first the immutable URL with <script integrity crossorigin> (what a
      # pinned page does; catches SRI/CORS regressions), then the alias URL the loader snippet uses.
      # The browser smokes below exercise the SDK bundle (test/e2e/specs/cdn-smoke.spec.ts). The
      # Salla integration gets the hash + header check above, and the alias check at the end.
      - name: Install Playwright Chromium
        if: vars.CDN_BASE_URL != '' && inputs.target != 'salla'
        working-directory: ${{ env.PKG_DIR }}
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test (immutable URL, SRI)
        if: vars.CDN_BASE_URL != '' && inputs.target != 'salla'
        working-directory: ${{ env.PKG_DIR }}
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          CDN_SMOKE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          export CDN_SMOKE_URL="${CDN_BASE_URL%/}/sdk/v${CDN_SMOKE_VERSION}/sfere.min.js"
          export CDN_SMOKE_SRI="$(node -p 'JSON.parse(require("fs").readFileSync("dist/cdn/manifest.json","utf8")).files.find(f=>f.path.endsWith("sfere.min.js")).sha384')"
          npx playwright test test/e2e/specs/cdn-smoke.spec.ts

      # Prereleases never move the alias (scripts/cdn-publish.sh). The edge caches the alias for
      # max-age=300 with stale-while-revalidate, and its cache key ignores query strings (seen on
      # the 0.3.1 deploy: a cache-busted URL returned the same cached object and Age), so no URL
      # trick bypasses it. Instead wait, bounded, until the edge serves this version's banner,
      # then run the browser smoke against the plain alias URL a client's snippet uses.
      - name: Browser smoke test (alias URL)
        if: vars.CDN_BASE_URL != '' && !contains(inputs.version, '-') && inputs.target != 'salla'
        working-directory: ${{ env.PKG_DIR }}
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          CDN_SMOKE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${CDN_SMOKE_VERSION%%.*}"
          REST="${CDN_SMOKE_VERSION#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" = "0" ]; then SEGMENT="v0.${MINOR}"; else SEGMENT="v${MAJOR}"; fi
          export CDN_SMOKE_URL="${CDN_BASE_URL%/}/sdk/${SEGMENT}/sfere.min.js"
          # Measured by hand on the 0.3.2 deploy: alias uploaded 11:11:07, first served by a
          # nearby edge ~11:19:17 (about 8 min). max-age is 300 s, but the backend bucket's serveWhileStale
          # (86400 s) lets each cache node answer once more from the stale copy while it
          # revalidates. 15 minutes leaves margin; a CDN invalidation would make this immediate
          # but needs an extra compute permission for the deploy account.
          DEADLINE=$(( $(date +%s) + 900 ))
          # Download, then read: `curl | head` makes curl exit 23 when head closes the pipe, and
          # under pipefail that failed every check even when the banner matched (0.3.2 deploy).
          served() {
            curl -fsS -o alias.js "$CDN_SMOKE_URL" && head -c 200 alias.js | grep -q "Sfere SDK v${CDN_SMOKE_VERSION} "
          }
          until served; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::$CDN_SMOKE_URL still does not serve v${CDN_SMOKE_VERSION} after 15 minutes"
              exit 1
            fi
            echo "Edge still serves the previous alias; retrying in 20 s"
            sleep 20
          done
          echo "Edge serves v${CDN_SMOKE_VERSION} at $CDN_SMOKE_URL"
          npx playwright test test/e2e/specs/cdn-smoke.spec.ts

      # Salla integration: wait, bounded, until the edge serves this version at the alias, then
      # require the alias bytes to hash to this build (the same bytes as the immutable URL).
      - name: Alias smoke test (Salla integration)
        if: vars.CDN_BASE_URL != '' && !contains(inputs.version, '-') && inputs.target == 'salla'
        env:
          CDN_BASE_URL: ${{ vars.CDN_BASE_URL }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          if [ "$MAJOR" = "0" ]; then SEGMENT="v0.${MINOR}"; else SEGMENT="v${MAJOR}"; fi
          URL="${CDN_BASE_URL%/}/${CDN_PREFIX}/${SEGMENT}/${CDN_ENTRY}"
          EXPECTED="$(node -p 'JSON.parse(require("fs").readFileSync(process.env.PKG_DIR + "/dist/cdn/manifest.json","utf8")).files.find(f=>f.path==="dist/cdn/"+process.env.CDN_ENTRY).sha384')"
          DEADLINE=$(( $(date +%s) + 900 ))
          served() {
            curl -fsS -o alias.js "$URL" && head -c 200 alias.js | grep -q "${CDN_BANNER} v${VERSION} "
          }
          until served; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::$URL still does not serve v${VERSION} after 15 minutes"
              exit 1
            fi
            echo "Edge still serves the previous alias; retrying in 20 s"
            sleep 20
          done
          ACTUAL="sha384-$(openssl dgst -sha384 -binary alias.js | openssl base64 -A)"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::alias $URL hashes to $ACTUAL, manifest says $EXPECTED"
            exit 1
          fi
          echo "Edge serves v${VERSION} at $URL ($EXPECTED)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: cdn-smoke-report
          path: |
            ${{ env.PKG_DIR }}/playwright-report/
            ${{ env.PKG_DIR }}/test-results/
          retention-days: 14
