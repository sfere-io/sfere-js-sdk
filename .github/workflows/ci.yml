name: ci

# PRs: full quality gate. workflow_call: reused by release.yml on every push to
# main, so a release can never publish bytes that didn't pass the same gate as
# everyone else — and so main isn't gated twice per push (no separate `push`
# trigger here; release.yml's `ci` job is the main-branch run).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check

      - name: Test with coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          for summary in packages/*/coverage/coverage-summary.json; do
            [ -f "$summary" ] || continue
            PKG="$(basename "$(dirname "$(dirname "$summary")")")"
            SUMMARY="$summary" PKG="$PKG" node -e '
              const t = require(require("path").resolve(process.env.SUMMARY)).total;
              const row = (k) => "| " + k + " | " + t[k].pct + "% | " + t[k].covered + "/" + t[k].total + " |";
              console.log(["### Coverage: " + process.env.PKG, "| metric | % | covered |", "|---|---|---|",
                ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          done
      # One artifact for every package; paths inside it are relative to packages/
      # (browser/coverage/..., node/coverage/...), which the sonar job restores.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage
          path: packages/*/coverage/
          retention-days: 14

      - name: Build
        run: npm run build
      - name: Size budget
        run: npm run size
      - name: Verify dist contract
        run: npm run verify
      - name: Pack dry run
        run: npm pack --dry-run --workspaces

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: packages/*/dist/
          retention-days: 14

  e2e:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # dist/ is rebuilt here rather than reusing the `check` artifact: it keeps
      # this job self-contained (installable Playwright browsers need the exact
      # same runner image the build ran on) and matches how `check` verifies dist.
      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Every package's e2e: the browser Playwright suite (including the React
      # harness built from the packed tarball) and the Node packed-tarball apps.
      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: packages/browser/playwright-report/
          retention-days: 14

  # SonarQube Cloud: static analysis + the coverage from `check`. Skipped until the
  # SONAR_TOKEN secret exists (and on fork PRs, which don't get secrets).
  sonar:
    needs: check
    runs-on: ubuntu-24.04
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          fetch-depth: 0 # blame data for new-code detection
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: env.SONAR_TOKEN != ''
        with:
          name: coverage
          path: packages/
      - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: env.SONAR_TOKEN != ''
      - name: Sonar skipped
        if: env.SONAR_TOKEN == ''
        run: echo "SONAR_TOKEN is not set; skipping SonarQube Cloud analysis." >> "$GITHUB_STEP_SUMMARY"
