name: release

# Push to main -> full CI gate, then Changesets decides what happens next:
#   - pending changesets exist  -> open/update the "Version Packages" PR (no publish)
#   - no pending changesets     -> that PR was just merged: stage the new
#                                  versions on registry.npmjs.org (Trusted
#                                  Publishing, `npm stage publish`). Nothing is
#                                  installable until a maintainer approves it
#                                  with 2FA.
#   - run by hand after approving (Actions > release > Run workflow): tag the
#     approved versions, cut a GitHub release with the CDN bundles attached,
#     and deploy the CDN.
# See docs/RELEASING.md for the developer-facing version of this flow.
on:
  push:
    branches: [main]
  # Finishes a release after its staged versions were approved on npmjs.com:
  # gh workflow run release.yml -R sfere-io/sfere-js-sdk --ref main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reuse the exact same gate a PR went through. A release that skipped this would
  # mean main and the published package could diverge in quality.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version-or-publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the Version PR branch / the release tag
      pull-requests: write # open/update the Version Packages PR
      id-token: write # npm Trusted Publishing (OIDC) to registry.npmjs.org
    outputs:
      published: ${{ steps.tag.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
      sha: ${{ steps.tag.outputs.sha }}
      node-published: ${{ steps.tag.outputs.node-published }}
      node-version: ${{ steps.tag.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets diffs against history to find pending changesets
      # No registry-url: npm's default registry is registry.npmjs.org, and
      # Trusted Publishing needs no .npmrc or token at all.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build here: `changeset publish` packs whatever is on disk, and dist/ is
      # gitignored. Without this step every npm release up to sfere-sdk 0.3.1 and
      # sfere-node 0.1.0 shipped without dist/ (the CI gate builds on a different
      # runner). Each package's prepublishOnly also refuses to publish unbuilt.
      - name: Build
        run: npm run build

      # `npm stage publish` (staged publishing) and Trusted Publishing need a
      # recent npm, and Node 22 (.nvmrc) ships npm 10. Installed before the
      # publish script runs. Pinned to an exact version.
      - name: Install npm for Trusted Publishing
        run: |
          npm install --global npm@11.21.0
          echo "node $(node --version), npm $(npm --version)"

      # changesets/action v2 (requires @changesets/cli v3, which package.json
      # pins). `version-script` runs when there are pending changesets: bumps
      # package.json, compiles CHANGELOG.md, and opens/updates the PR through the
      # GitHub API with the default GITHUB_TOKEN. `publish-script` runs instead
      # when there are none (i.e. that PR was just merged, or this is the
      # finishing run): scripts/stage-release.sh stages every version that is
      # neither on registry.npmjs.org nor already staged, and pushes a
      # `staged/<tag>` marker for each. No npm token: `npm stage publish`
      # exchanges this job's OIDC token (`id-token: write`) for a short-lived
      # token and attaches provenance. That needs a trusted publisher for each
      # package on npmjs.com (docs/RELEASING.md, "Trusted Publishing").
      # Tagging and the GitHub release are this workflow's job, not the
      # action's: `push-git-tags` / `create-github-releases` are off, so the
      # canonical vX.Y.Z tag is created once, below, and the release (with the
      # CDN bundles attached) is cut by release-artifacts. Repository setting
      # required: Actions > General > "Allow GitHub Actions to create and
      # approve pull requests".
      - name: Version Packages PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false

      # Decide "published" ourselves: the action's own output knows nothing
      # about staging or approval. Rule, per public workspace package: when no
      # changesets are pending, the version in its package.json exists on
      # registry.npmjs.org (i.e. it was approved), and its tag does not exist
      # yet, this run released it. A version that is staged but not approved
      # yet is reported in the step summary and skipped, not failed. That also
      # recovers a run whose later jobs failed: the next run tags (and, for the
      # browser SDK, deploys) the missed version. Every package is downloaded
      # back and checked before any tag is pushed, so a broken publish leaves
      # nothing tagged.
      #
      # The tag goes on the commit the `staged/<tag>` marker records, which is
      # what the approved bytes were built from, and the marker is then
      # deleted. Without a marker (a version published by hand) it goes on HEAD.
      #
      # Tags: the browser SDK keeps plain `vX.Y.Z` (cdn-deploy.yml and the
      # GitHub release check it out); every other package gets the Changesets
      # form `<name>@X.Y.Z`. `published`/`version` describe the browser SDK
      # (release artifacts, the React release page and the CDN deploy hang off
      # it); `node-published`/`node-version` drive the Node SDK's release page.
      #
      # Pushed with the GITHUB_TOKEN credentials actions/checkout persisted. A tag
      # pushed by GITHUB_TOKEN never starts other workflows, which is fine: the
      # CDN deploy is invoked below via workflow_call, not by a tag trigger.
      - name: Tag the published versions
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          BROWSER="@sfere.io/sfere-sdk"
          NODE="@sfere.io/sfere-node"
          PUBLISHED=false
          VERSION=""
          SHA=""
          NODE_PUBLISHED=false
          NODE_VERSION=""
          RELEASED=()
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then continue; fi
            NAME="$(node -p "require('./$manifest').name")"
            V="$(node -p "require('./$manifest').version")"
            if [ "$NAME" = "$BROWSER" ]; then TAG="v$V"; else TAG="$NAME@$V"; fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG already tagged; nothing to release for $NAME." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            MARKER="staged/$TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$MARKER" > /dev/null; then
              git fetch --quiet origin "refs/tags/$MARKER:refs/tags/$MARKER"
              TARGET="$(git rev-parse "refs/tags/$MARKER^{commit}")"
              HAS_MARKER=true
            else
              TARGET="$(git rev-parse HEAD)"
              HAS_MARKER=false
            fi
            if ! npm view "$NAME@$V" version > /dev/null 2>&1; then
              if [ "$HAS_MARKER" = true ]; then
                echo "::notice::$NAME@$V is staged and waiting for approval: \`npm stage list $NAME\`, then \`npm stage approve <id>\` (or approve it on npmjs.com), then run this workflow again (Actions > release > Run workflow)."
                echo "$NAME@$V is staged and waiting for approval; approve it, then run this workflow again." >> "$GITHUB_STEP_SUMMARY"
                continue
              fi
              echo "::error::$NAME@$V is neither on registry.npmjs.org nor staged after the publish step."
              exit 1
            fi
            # Read anonymously, exactly as a user installs. registry.npmjs.org
            # can answer 404 for a short while after an approval.
            SCRATCH="$(mktemp -d)"
            for attempt in $(seq 1 12); do
              if (cd "$SCRATCH" && npm pack "$NAME@$V" --json > pack.json 2> pack.err); then break; fi
              if [ "$attempt" -eq 12 ]; then
                cat "$SCRATCH/pack.err"
                echo "::error::$NAME@$V is listed on registry.npmjs.org but its tarball cannot be downloaded."
                exit 1
              fi
              echo "registry.npmjs.org does not serve $NAME@$V yet; retrying in 15 s ($attempt/12)."
              sleep 15
            done
            # The registry's copy must be complete: require its entry points
            # (the release that shipped without dist/ passed every other check).
            for f in dist/index.js dist/index.cjs dist/index.d.ts; do
              if ! node -e "process.exit(require('$SCRATCH/pack.json')[0].files.some(x => x.path === '$f') ? 0 : 1)"; then
                echo "::error::$NAME@$V on registry.npmjs.org has no $f: the published package is broken."
                exit 1
              fi
            done
            echo "registry.npmjs.org copy of $NAME@$V contains its dist/ entry points."
            RELEASED+=("$NAME|$V|$TAG|$TARGET|$HAS_MARKER")
          done
          for entry in "${RELEASED[@]}"; do
            IFS="|" read -r NAME V TAG TARGET HAS_MARKER <<< "$entry"
            git tag "$TAG" "$TARGET"
            git push origin "refs/tags/$TAG"
            if [ "$HAS_MARKER" = true ]; then git push origin ":refs/tags/staged/$TAG"; fi
            echo "Released $NAME@$V as $TAG (commit ${TARGET:0:7})." >> "$GITHUB_STEP_SUMMARY"
            if [ "$NAME" = "$BROWSER" ]; then
              PUBLISHED=true
              VERSION="$V"
              SHA="$TARGET"
            elif [ "$NAME" = "$NODE" ]; then
              NODE_PUBLISHED=true
              NODE_VERSION="$V"
            fi
          done
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "node-published=$NODE_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "node-version=$NODE_VERSION" >> "$GITHUB_OUTPUT"

  release-artifacts:
    needs: version-or-publish
    if: needs.version-or-publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the Browser and React GitHub releases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.version-or-publish.outputs.version }}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Rebuild deterministically from the tag rather than reusing the `ci` job's
      # artifact — the release assets must be traceably built from exactly the
      # tagged commit, the same rule cdn-deploy.yml follows.
      - run: npm run build
      - run: npm run verify
      - run: npm run cdn:manifest

      - name: Prerelease?
        id: kind
        run: |
          case "${{ needs.version-or-publish.outputs.version }}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # One release page per framework: Browser (this tag, with the CDN files),
      # React and Node. React ships inside @sfere.io/sfere-sdk at the /react
      # subpath, so its page is the same version and commit as the browser one,
      # under its own `react-vX.Y.Z` tag. Both pages quote this version's
      # CHANGELOG.md section.
      - name: Release notes
        env:
          VERSION: ${{ needs.version-or-publish.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / && found { exit } found' \
            packages/browser/CHANGELOG.md > "$RUNNER_TEMP/browser-changes.md"
          {
            echo "Browser SDK \`@sfere.io/sfere-sdk@$VERSION\`: on npm (registry.npmjs.org), and the CDN files attached below."
            cat "$RUNNER_TEMP/browser-changes.md"
          } > "$RUNNER_TEMP/browser-notes.md"
          {
            echo "React bindings for the Sfere browser SDK. They ship inside \`@sfere.io/sfere-sdk@$VERSION\` at the \`@sfere.io/sfere-sdk/react\` subpath, so this page has the same version and commit as [Browser SDK v$VERSION]($REPO_URL/releases/tag/v$VERSION)."
            echo
            echo '```sh'
            echo "npm install @sfere.io/sfere-sdk@$VERSION"
            echo '```'
            echo
            echo '```tsx'
            echo 'import { SfereProvider, useSfere, usePageTracking } from "@sfere.io/sfere-sdk/react";'
            echo '```'
            echo
            echo "React 17 to 19 is an optional peer dependency."
            echo
            echo "## Changes in v$VERSION"
            cat "$RUNNER_TEMP/browser-changes.md"
          } > "$RUNNER_TEMP/react-notes.md"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ needs.version-or-publish.outputs.version }}"
          name: "Browser SDK v${{ needs.version-or-publish.outputs.version }}"
          prerelease: ${{ steps.kind.outputs.prerelease }}
          body_path: ${{ runner.temp }}/browser-notes.md
          generate_release_notes: true
          files: |
            packages/browser/dist/cdn/sfere.min.js
            packages/browser/dist/cdn/sfere.js
            packages/browser/dist/cdn/manifest.json

      # The action creates the `react-v` tag on the commit `vX.Y.Z` points at
      # (the tag step's `sha` output, not github.sha: a release is finished by a
      # later run, when main may have moved on). make_latest stays
      # false so the browser release remains the repository's "Latest".
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "react-v${{ needs.version-or-publish.outputs.version }}"
          target_commitish: ${{ needs.version-or-publish.outputs.sha }}
          name: "React v${{ needs.version-or-publish.outputs.version }}"
          prerelease: ${{ steps.kind.outputs.prerelease }}
          make_latest: false
          body_path: ${{ runner.temp }}/react-notes.md

  # Release page for the Node SDK, cut whenever this run tagged a new
  # `@sfere.io/sfere-node@X.Y.Z`, with or without a browser release.
  release-node:
    needs: version-or-publish
    if: needs.version-or-publish.outputs.node-published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    env:
      TAG: "@sfere.io/sfere-node@${{ needs.version-or-publish.outputs.node-version }}"
      VERSION: ${{ needs.version-or-publish.outputs.node-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "refs/tags/${{ env.TAG }}"

      - name: Release notes
        id: notes
        run: |
          {
            echo "Node SDK \`@sfere.io/sfere-node@$VERSION\` on npm (registry.npmjs.org)."
            echo
            echo '```sh'
            echo "npm install @sfere.io/sfere-node@$VERSION"
            echo '```'
            awk -v heading="## $VERSION" '$0 == heading { found = 1; next } /^## / && found { exit } found' \
              packages/node/CHANGELOG.md
          } > "$RUNNER_TEMP/node-notes.md"
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: "Node SDK v${{ env.VERSION }}"
          prerelease: ${{ steps.notes.outputs.prerelease }}
          make_latest: false
          body_path: ${{ runner.temp }}/node-notes.md

  # A called workflow can never hold more permissions than the calling job grants
  # it, so the WIF `id-token: write` cdn-deploy.yml's deploy job needs must be
  # granted here too.
  cdn-deploy:
    needs: [version-or-publish, release-artifacts]
    if: needs.version-or-publish.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cdn-deploy.yml
    with:
      version: "${{ needs.version-or-publish.outputs.version }}"
