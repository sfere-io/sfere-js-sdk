name: release

# Push to main -> full CI gate, then Changesets decides what happens next:
#   - pending changesets exist  -> open/update the "Version Packages" PR (no publish)
#   - no pending changesets     -> that PR was just merged: publish to GitHub
#                                  Packages, tag, cut a GitHub release with the
#                                  CDN bundles attached, and deploy the CDN.
# See docs/RELEASING.md for the developer-facing version of this flow.
on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reuse the exact same gate a PR went through. A release that skipped this would
  # mean main and the published package could diverge in quality.
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  version-or-publish:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write # push the Version PR branch / the release tag
      pull-requests: write # open/update the Version Packages PR
      packages: write # publish to GitHub Packages
    outputs:
      published: ${{ steps.tag.outputs.published }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # changesets diffs against history to find pending changesets
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@fanfinity"
      - run: npm ci
      # Build here: `changeset publish` packs whatever is on disk, and dist/ is
      # gitignored. Without this step every npm release up to sfere-sdk 0.3.1 and
      # sfere-node 0.1.0 shipped without dist/ (the CI gate builds on a different
      # runner). Each package's prepublishOnly also refuses to publish unbuilt.
      - name: Build
        run: npm run build

      # changesets/action v2 (requires @changesets/cli v3, which package.json
      # pins). `version-script` runs when there are pending changesets: bumps
      # package.json, compiles CHANGELOG.md, and opens/updates the PR through the
      # GitHub API with the default GITHUB_TOKEN. `publish-script` runs instead
      # when there are none (i.e. that PR was just merged). Tagging and the
      # GitHub release are this workflow's job, not the action's: the `release`
      # script passes --no-git-tag, and `push-git-tags` / `create-github-releases`
      # are off, so the canonical vX.Y.Z tag is created once, below, and the
      # release (with the CDN bundles attached) is cut by release-artifacts.
      # NODE_AUTH_TOKEN feeds the .npmrc actions/setup-node wrote for
      # npm.pkg.github.com. Repository setting required: Actions > General >
      # "Allow GitHub Actions to create and approve pull requests".
      - name: Version Packages PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: npm run version-packages
          publish-script: npm run release
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: false
          push-git-tags: false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Decide "published" ourselves instead of trusting the action's output: with
      # `--no-git-tag` the Changesets CLI emits no release events, so the action
      # reports published=false even after a successful publish (seen on the
      # first 0.1.0 release). Rule, per public workspace package: when no
      # changesets are pending, the version in its package.json exists on the
      # registry, and its tag does not exist yet, this run released it. That also
      # recovers a run whose later jobs failed: the next push to main tags (and,
      # for the browser SDK, deploys) the missed version.
      #
      # Tags: the browser SDK keeps plain `vX.Y.Z` (cdn-deploy.yml and the
      # GitHub release check it out); every other package gets the Changesets
      # form `<name>@X.Y.Z`. The job outputs describe the browser SDK only,
      # because only it has release artifacts and a CDN deploy.
      #
      # Pushed with the GITHUB_TOKEN credentials actions/checkout persisted. A tag
      # pushed by GITHUB_TOKEN never starts other workflows, which is fine: the
      # CDN deploy is invoked below via workflow_call, not by a tag trigger.
      - name: Tag the published versions
        id: tag
        if: steps.changesets.outputs.has-changesets == 'false'
        run: |
          BROWSER="@fanfinity/sfere-sdk"
          PUBLISHED=false
          VERSION=""
          for manifest in packages/*/package.json; do
            if [ "$(node -p "require('./$manifest').private === true")" = "true" ]; then continue; fi
            NAME="$(node -p "require('./$manifest').name")"
            V="$(node -p "require('./$manifest').version")"
            if [ "$NAME" = "$BROWSER" ]; then TAG="v$V"; else TAG="$NAME@$V"; fi
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
              echo "$TAG already tagged; nothing to release for $NAME." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if ! npm view "$NAME@$V" version > /dev/null 2>&1; then
              echo "::error::$NAME@$V is not on the registry after the publish step."
              exit 1
            fi
            # The registry's copy must be complete: fetch it back and require its
            # entry points (the release that shipped without dist/ passed every
            # other check).
            SCRATCH="$(mktemp -d)"
            (cd "$SCRATCH" && npm pack "$NAME@$V" --json > pack.json)
            for f in dist/index.js dist/index.cjs dist/index.d.ts; do
              if ! node -e "process.exit(require('$SCRATCH/pack.json')[0].files.some(x => x.path === '$f') ? 0 : 1)"; then
                echo "::error::$NAME@$V on the registry has no $f: the published package is broken."
                exit 1
              fi
            done
            echo "Registry copy of $NAME@$V contains its dist/ entry points."
            git tag "$TAG" HEAD
            git push origin "$TAG"
            echo "Released $NAME@$V as $TAG." >> "$GITHUB_STEP_SUMMARY"
            if [ "$NAME" = "$BROWSER" ]; then
              PUBLISHED=true
              VERSION="$V"
            fi
          done
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-artifacts:
    needs: version-or-publish
    if: needs.version-or-publish.outputs.published == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "v${{ needs.version-or-publish.outputs.version }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Rebuild deterministically from the tag rather than reusing the `ci` job's
      # artifact — the release assets must be traceably built from exactly the
      # tagged commit, the same rule cdn-deploy.yml follows.
      - run: npm run build
      - run: npm run verify
      - run: npm run cdn:manifest

      - name: Prerelease?
        id: kind
        run: |
          case "${{ needs.version-or-publish.outputs.version }}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: "v${{ needs.version-or-publish.outputs.version }}"
          name: "v${{ needs.version-or-publish.outputs.version }}"
          prerelease: ${{ steps.kind.outputs.prerelease }}
          generate_release_notes: true
          files: |
            packages/browser/dist/cdn/sfere.min.js
            packages/browser/dist/cdn/sfere.js
            packages/browser/dist/cdn/manifest.json

  # A called workflow can never hold more permissions than the calling job grants
  # it, so the WIF `id-token: write` cdn-deploy.yml's deploy job needs must be
  # granted here too.
  cdn-deploy:
    needs: [version-or-publish, release-artifacts]
    if: needs.version-or-publish.outputs.published == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cdn-deploy.yml
    with:
      version: "${{ needs.version-or-publish.outputs.version }}"
