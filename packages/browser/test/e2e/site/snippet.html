<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>snippet</title>
  </head>
  <body>
    <!--
      The documented loader snippet, verbatim apart from the src/data-* attributes pointing at the
      local CDN emulation and the mock ingestion host. identify/page/track are called immediately
      after installing the stub, while the bundle is still an in-flight (async) network request:
      this is the "queued before load" case the snippet exists for.
    -->
    <script>
      !(function (w, d) {
        if (w.sfere) return;
        var q = (w.sfere = []);
        ["track", "page", "identify", "group", "alias", "reset", "setConsent"].forEach(function (m) {
          q[m] = function () {
            q.push([m].concat([].slice.call(arguments)));
            return q;
          };
        });
        var s = d.createElement("script");
        s.async = true;
        s.src = "/sdk/v0.1/sfere.min.js";
        s.setAttribute("data-write-key", "keyIdE2E:secretE2E");
        s.setAttribute("data-host", "http://127.0.0.1:4311");
        d.head.appendChild(s);
      })(window, document);
      window.sfere.identify("user-e2e-1", { plan: "pro" });
      window.sfere.page("Home");
      window.sfere.track("queued_event", { n: 1 });
    </script>
  </body>
</html>
